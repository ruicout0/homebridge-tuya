name: Publish to npm

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Required for creating git tags and GitHub Releases
      id-token: write   # Required for npm OIDC Trusted Publishing & Provenance
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Check if version is already published
        id: check_version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          PKG_NAME=$(node -p "require('./package.json').name")
          echo "Package: $PKG_NAME @ $CURRENT_VERSION"
          echo "package_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          
          if npm view "$PKG_NAME@$CURRENT_VERSION" version --silent > /dev/null 2>&1; then
            echo "Version $CURRENT_VERSION is already published to npm. Skipping publish."
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "Version $CURRENT_VERSION is not on npm yet. Proceeding with publish."
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.check_version.outputs.should_publish == 'true'
        run: npm ci || npm install

      - name: Publish to npm (Trusted Publishing OIDC)
        if: steps.check_version.outputs.should_publish == 'true'
        run: npm publish --access public --provenance

      - name: Create GitHub Release
        if: steps.check_version.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.check_version.outputs.package_version }}
          name: v${{ steps.check_version.outputs.package_version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
